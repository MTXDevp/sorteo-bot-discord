[project]
name = "sorteo-bot-discord"
version = "1.0.0"
description = "Bot de Discord para gestionar sorteos ponderados con persistencia SQLite y comandos híbridos (slash + prefijo)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MTX" }]
keywords = ["discord", "bot", "sorteo", "giveaway", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Typing :: Typed",
]
dependencies = [
  "discord.py>=2.4,<3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "rapidfuzz>=3.9",
  "aiosqlite>=0.20",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11,<2",
  "pre-commit>=3",
]

[project.scripts]
sorteo-bot = "sorteo_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sorteo_bot"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "LOG", "TRY", "EM"]
ignore = ["EM101", "EM102", "TRY003"]

[tool.ruff.lint.isort]
known-first-party = ["sorteo_bot"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = "discord.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=sorteo_bot --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/sorteo_bot"]
branch = true
